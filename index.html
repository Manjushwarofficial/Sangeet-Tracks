<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonu Dada Cha Sangeet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #1a1410;
    color: #D3C2A4;
}

.page {
    min-height: 100vh;
    display: none;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes waveText {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* ---------- LANDING ---------- */
#welcome {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: fadeIn 0.5s ease-in;
}

.welcome-title {
    font-size: 4rem;
    font-family: cursive;
    animation: waveText 2s infinite;
}

.welcome-subtitle {
    font-size: 3rem;
    font-family: cursive;
    animation: waveText 2s infinite;
    animation-delay: 0.2s;
}

.enter-btn {
    margin-top: 30px;
    padding: 16px 32px;
    border-radius: 999px;
    border: none;
    background: #D3C2A4;
    color: #1a1410;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
}

.enter-btn:hover {
    transform: scale(1.05);
}

/* ---------- SONG LIST ---------- */
.container {
    max-width: 1000px;
    margin: 80px auto;
    padding: 0 20px;
}

.page-title {
    text-align: center;
    font-size: 2.5rem;
    font-family: cursive;
    margin-bottom: 30px;
}

.song-grid {
    display: grid;
    gap: 24px;
}

@media (min-width: 768px) {
    .song-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

.song-card {
    background: rgba(211,194,164,0.1);
    border: 2px solid rgba(211,194,164,0.2);
    padding: 24px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.song-card:hover {
    transform: translateY(-6px);
    background: rgba(211,194,164,0.15);
}

.song-title {
    font-size: 1.4rem;
    font-weight: bold;
}

.song-movie {
    font-size: 0.9rem;
    opacity: 0.7;
}

/* ---------- LYRICS ---------- */
#lyricsPage {
    padding: 40px 20px;
    animation: fadeIn 0.4s ease-in;
}

.lyrics-card {
    max-width: 800px;
    margin: auto;
    background: rgba(211,194,164,0.1);
    border: 2px solid rgba(211,194,164,0.2);
    padding: 40px;
    border-radius: 24px;
}

.lyrics-title {
    font-size: 2.3rem;
    font-family: cursive;
    text-align: center;
}

.lyrics-movie {
    text-align: center;
    opacity: 0.7;
    margin-bottom: 20px;
}

.lyrics-text {
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 1.1rem;
}

.lyrics-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
}

.btn {
    padding: 12px 24px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.btn-back {
    background: rgba(211,194,164,0.2);
    color: #D3C2A4;
}

.btn-next {
    background: #D3C2A4;
    color: #1a1410;
}
</style>
</head>

<body>

<!-- LANDING PAGE -->
<div id="landingPage" class="page active">

    <div id="welcome">
        <h1 class="welcome-title">Sonu Dada Cha</h1>
        <h2 class="welcome-subtitle">Sangeet</h2>
        <button class="enter-btn" onclick="scrollToSongs()">Scroll Down ↓</button>
    </div>

    <div class="container">
        <h1 class="page-title">Song Collection</h1>
        <div class="song-grid" id="songGrid"></div>
    </div>

</div>

<!-- LYRICS PAGE -->
<div id="lyricsPage" class="page">

    <div class="lyrics-card">
        <h1 class="lyrics-title" id="lyricsTitle"></h1>
        <p class="lyrics-movie" id="lyricsMovie"></p>

        <pre class="lyrics-text" id="lyricsText"></pre>

        <div class="lyrics-footer">
            <button class="btn btn-back" onclick="showPage('landingPage')">← Back</button>
            <button class="btn btn-next" onclick="nextSong()">Next →</button>
        </div>
    </div>

</div>

<script>
var songs = [
    {
        title: "Maahi Ve",
        movie: "Kal Ho Naa Ho",
        lyrics: "Maahi ve, maahi ve...\nTere liye duniya chhod di maine..."
    },
    {
        title: "London Thumakda",
        movie: "Queen",
        lyrics: "London thumakda...\nFeeling good today..."
    },
    {
        title: "Gallan Goodiyaan",
        movie: "Dil Dhadakne Do",
        lyrics: "Gallan goodiyaan...\nChal ud chaliye..."
    },
    {
        title: "Badtameez Dil",
        movie: "YJHD",
        lyrics: "Badtameez dil...\nBaawra sa dil..."
    },
    {
        title: "Bole Chudiyan",
        movie: "K3G",
        lyrics: "Bole chudiyan...\nHaaye main hogayi teri..."
    }
];

var currentSongIndex = 0;

function scrollToSongs() {
    document.getElementById("songGrid").scrollIntoView({ behavior: "smooth" });
}

function showPage(pageId) {
    document.getElementById("landingPage").style.display = "none";
    document.getElementById("lyricsPage").style.display = "none";
    document.getElementById(pageId).style.display = "block";
}

function showSong(index) {
    currentSongIndex = index;
    document.getElementById("lyricsTitle").innerText = songs[index].title;
    document.getElementById("lyricsMovie").innerText = songs[index].movie;
    document.getElementById("lyricsText").innerText = songs[index].lyrics;
    showPage("lyricsPage");
}

function nextSong() {
    currentSongIndex = (currentSongIndex + 1) % songs.length;
    showSong(currentSongIndex);
}

function renderSongs() {
    var grid = document.getElementById("songGrid");
    grid.innerHTML = "";
    songs.forEach((song, i) => {
        grid.innerHTML += `
            <div class="song-card" onclick="showSong(${i})">
                <div class="song-title">${song.title}</div>
                <div class="song-movie">${song.movie}</div>
            </div>
        `;
    });
}

renderSongs();
</script>

</body>
</html>
